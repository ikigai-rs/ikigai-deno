name: CI

on:
  push:
    branches: [main]
  pull_request:

# The gate commands live in ONE place: the `tasks` of deno.json. Each step below
# runs one of them, and `deno task check` (which the repo's justfile `gates`
# recipe calls) chains the same seven in the same order, so local gates and CI
# cannot drift apart. Change a gate in deno.json, not here.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format
        run: deno task fmt-check
      - name: Lint
        run: deno task lint
      - name: Type-check
        run: deno task typecheck
      - name: Doc examples
        # Type-checks every ```ts block in src/ JSDoc and in README.md. It does
        # not RUN them: they dial the default socket or serve forever.
        run: deno task doc-check
      - name: Doc lint
        # Every exported symbol of the mod, wire, client and serve entry points
        # carries JSDoc (JSR scores it), so the missing-jsdoc count stays 0.
        # `zod.ts` is not linted here: its signatures name zod's own types,
        # which `deno doc --lint` reports as private-type-ref.
        run: deno task doc-lint
      - name: Doc tests
        # RUNS the doc examples of the files whose examples are pure: the
        # wire shapes they pin (call, reply and hello bytes) are checked, not
        # just type-checked. client.ts and serve.ts examples dial or serve
        # forever, so they stay type-check-only (above).
        run: deno task doc-test
      - name: Test
        # Integration tests that need the `ikigai` binary skip themselves
        # when it is absent (CI has no Rust host; they run locally).
        # TTT_HOST_OPTIONAL lets the tic-tac-toe parity test skip here as well,
        # though `CI` is set: the interop job builds ttt-host and runs it.
        env:
          TTT_HOST_OPTIONAL: "the interop job runs the parity test"
        run: deno task test
      # The library runs on Node and Bun through src/runtime_node.ts (ledger
      # #3627). `--require` makes an absent runtime a failure, so the rows
      # cannot silently report "absent" here. Pinned to what the spike
      # measured; move them deliberately.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Cross-runtime (Node and Bun)
        run: deno task cross-runtime --require

  # The real Rust door. The `test` job skips every host-backed test (no binary);
  # this one builds the pinned ikigai-cli, cached by its version, puts it on PATH
  # and runs the same suite so the integration and IssueWith tests actually run.
  # Move IKIGAI_CLI_VERSION to follow the door.
  #
  # It also builds ikigai-tutorial's `ttt-host` for the tic-tac-toe parity test,
  # which drives that binary, not the `ikigai` cli, so the cli pin does not cover
  # it. Here the parity test is REQUIRED: with `CI` set it fails, rather than
  # skips, when no ttt-host is found.
  interop:
    runs-on: ubuntu-latest
    env:
      IKIGAI_CLI_VERSION: "0.2.8"
      # The ikigai-tutorial commit ttt-host is built from. It moves when the
      # tutorial changes what ttt-host answers (its views, refusals or routes):
      # move it to the tutorial's main, bring the parity test up to date in the
      # same PR, and the cache below rebuilds for the new rev.
      TTT_HOST_REV: "8c30fe704537c1a87ca384e6e5de1ab4443827d6"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache ikigai-cli
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ~/ikigai-cli
          key: ikigai-cli-${{ env.IKIGAI_CLI_VERSION }}
      - name: Build ikigai-cli
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: cargo install ikigai-cli --version "$IKIGAI_CLI_VERSION" --locked --root ~/ikigai-cli
      - name: Cache ttt-host
        id: ttt-cache
        uses: actions/cache@v4
        with:
          path: ~/ttt-host
          key: ttt-host-${{ runner.os }}-${{ env.TTT_HOST_REV }}
      - name: Build ttt-host
        if: steps.ttt-cache.outputs.cache-hit != 'true'
        run: >-
          cargo install --git https://github.com/ikigai-rs/ikigai-tutorial
          --rev "$TTT_HOST_REV" --locked ttt-host --root ~/ttt-host
      - name: Interop tests
        run: |
          export PATH="$HOME/ikigai-cli/bin:$PATH"
          export TTT_HOST="$HOME/ttt-host/bin/ttt-host"
          ikigai --version
          test -x "$TTT_HOST"
          deno task test
