name: CI

on:
  push:
    branches: [main]
  pull_request:

# The gate commands live in ONE place: the `tasks` of deno.json. Each step below
# runs one of them, and `deno task check` (which the repo's justfile `gates`
# recipe calls) chains the same five in the same order, so local gates and CI
# cannot drift apart. Change a gate in deno.json, not here.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format
        run: deno task fmt-check
      - name: Lint
        run: deno task lint
      - name: Type-check
        run: deno task typecheck
      - name: Doc examples
        # Type-checks every ```ts block in src/ JSDoc and in README.md. It does
        # not RUN them: they dial the default socket or serve forever.
        run: deno task doc-check
      - name: Test
        # Integration tests that need the `ikigai` binary skip themselves
        # when it is absent (CI has no Rust host; they run locally).
        run: deno task test
