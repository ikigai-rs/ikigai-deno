name: CI

on:
  push:
    branches: [main]
  pull_request:

# The gate commands live in ONE place: the `tasks` of deno.json. Each step below
# runs one of them, and `deno task check` (which the repo's justfile `gates`
# recipe calls) chains the same seven in the same order, so local gates and CI
# cannot drift apart. Change a gate in deno.json, not here.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format
        run: deno task fmt-check
      - name: Lint
        run: deno task lint
      - name: Type-check
        run: deno task typecheck
      - name: Doc examples
        # Type-checks every ```ts block in src/ JSDoc and in README.md. It does
        # not RUN them: they dial the default socket or serve forever.
        run: deno task doc-check
      - name: Doc lint
        # Every exported symbol of the mod, wire, client and serve entry points
        # carries JSDoc (JSR scores it), so the missing-jsdoc count stays 0.
        # `zod.ts` is not linted here: its signatures name zod's own types,
        # which `deno doc --lint` reports as private-type-ref.
        run: deno task doc-lint
      - name: Doc tests
        # RUNS the doc examples of the files whose examples are pure: the
        # wire shapes they pin (call, reply and hello bytes) are checked, not
        # just type-checked. client.ts and serve.ts examples dial or serve
        # forever, so they stay type-check-only (above).
        run: deno task doc-test
      - name: Test
        # Integration tests that need the `ikigai` binary skip themselves
        # when it is absent (CI has no Rust host; they run locally).
        run: deno task test

  # The real Rust door. The `test` job skips every host-backed test (no binary);
  # this one builds the pinned ikigai-cli, cached by its version, puts it on PATH
  # and runs the same suite so the integration and IssueWith tests actually run.
  # Move IKIGAI_CLI_VERSION to follow the door.
  interop:
    runs-on: ubuntu-latest
    env:
      IKIGAI_CLI_VERSION: "0.1.66"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache ikigai-cli
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ~/ikigai-cli
          key: ikigai-cli-${{ env.IKIGAI_CLI_VERSION }}
      - name: Build ikigai-cli
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: cargo install ikigai-cli --version "$IKIGAI_CLI_VERSION" --locked --root ~/ikigai-cli
      - name: Interop tests
        run: |
          export PATH="$HOME/ikigai-cli/bin:$PATH"
          ikigai --version
          deno task test
