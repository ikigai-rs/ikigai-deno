name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format
        run: deno fmt --check
      - name: Lint
        run: deno lint
      - name: Type-check
        run: deno check src/mod.ts examples/demo.ts
      - name: Test
        # Integration tests that need the `ikigai` binary skip themselves
        # when it is absent (CI has no Rust host; they run locally).
        run: deno test -A
